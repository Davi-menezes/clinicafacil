version: "3.8"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: clinicafacil-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://clinicafacil:${DB_PASSWORD}@postgres:5432/clinicafacil
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=https://clinicafacil.com.br
    env_file:
      - ./apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinicafacil
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: clinicafacil-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.clinicafacil.com.br
    networks:
      - clinicafacil

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: clinicafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicafacil
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clinicafacil
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicafacil -d clinicafacil"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinicafacil

  redis:
    image: redis:7-alpine
    container_name: clinicafacil-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinicafacil

  nginx:
    image: nginx:1.25-alpine
    container_name: clinicafacil-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api
      - web
    networks:
      - clinicafacil

volumes:
  pgdata:
  redisdata:

networks:
  clinicafacil:
    driver: bridge